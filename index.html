<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps App</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem 2.5rem; border-radius: 16px;
            text-align: center; max-width: 420px; }
    h1 { margin-top: 0; }
    #msg { color: #38bdf8; font-weight: 600; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; border: 0; border-radius: 8px;
             background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; }
    small { display: block; margin-top: 1rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Nginx 🚀</h1>
    <p id="msg">Loading from backend...</p>
    <button onclick="load()">Call backend again</button>
    <small>Frontend: Nginx · Backend: Node.js · Monitoring: Prometheus</small>
  </div>
  <script>
    async function load() {
      const el = document.getElementById('msg');
      try {
        const r = await fetch('/api/hello');
        const d = await r.json();
        el.textContent = d.message + ' (call #' + d.calls + ')';
      } catch (e) {
        el.textContent = 'Backend not reachable';
      }
    }
    load();
  </script>
</body>
</html>
